# Конфигурация Cloudflare Worker'а.
#
# Секреты (TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET) в этот файл НЕ добавляются —
# они задаются отдельно командой `wrangler secret put <ИМЯ>` и хранятся
# на стороне Cloudflare, а не в репозитории проекта.

name = "utility-counters-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Привязка базы данных D1 "et14a".
# database_id заполняется значением, которое выведет команда
# `wrangler d1 create et14a` — см. инструкцию по деплою.
[[d1_databases]]
binding = "DB"
database_name = "et14a"
database_id = "39014a90-8b8b-4e1a-9a2c-07eda2556848"